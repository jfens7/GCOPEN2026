<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Draws | 2026 Gold Coast Open</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: #0F172A;
            color: #E2E8F0;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .navbar {
            background-color: #1E3A8A;
            border-bottom: 2px solid #D97706;
        }

        .navbar a { color: #F8FAFC; }
        .navbar a.active { color: #FDE68A; border-bottom: 2px solid #FDE68A; }

        .draw-header {
            text-align: center;
            padding: 40px 20px 20px 20px;
            background: linear-gradient(180deg, rgba(30,58,138,0.4) 0%, rgba(15,23,42,1) 100%);
        }

        .draw-header h1 {
            margin: 0;
            font-size: 38px;
            font-weight: 900;
            color: #F8FAFC;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(217, 119, 6, 0.4);
        }

        .draw-header p { color: #94A3B8; font-size: 15px; margin-top: 8px; }

        .event-selector {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .event-selector select {
            background: rgba(30, 58, 138, 0.4);
            border: 1px solid #334155;
            color: white;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 8px;
            outline: none;
            cursor: pointer;
            backdrop-filter: blur(10px);
        }

        .event-selector select:focus { border-color: #D97706; }

        /* Stage Toggle Buttons */
        .stage-toggles {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 20px 0 30px 0;
        }

        .btn-stage {
            background: rgba(255,255,255,0.05);
            border: 1px solid #334155;
            color: #94A3B8;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-stage.active {
            background: #D97706;
            color: #0F172A;
            border-color: #D97706;
            box-shadow: 0 0 10px rgba(217, 119, 6, 0.4);
        }

        /* --- GROUP STAGE UI --- */
        .group-stage-container {
            max-width: 1000px;
            margin: 0 auto 60px auto;
            padding: 0 20px;
        }

        .groups-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 25px;
        }

        .group-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 15px;
            backdrop-filter: blur(5px);
        }

        .group-card h3 {
            margin: 0 0 12px 0;
            color: #D97706;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid #334155;
            padding-bottom: 6px;
        }

        .group-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        .group-table th {
            color: #64748B;
            text-align: center;
            padding: 8px;
            font-size: 11px;
            text-transform: uppercase;
        }

        .group-table th:first-child { text-align: left; }

        .group-table td {
            padding: 10px 8px;
            border-top: 1px solid rgba(255,255,255,0.05);
            text-align: center;
        }

        .group-table td:first-child { text-align: left; font-weight: 600; }

        .advancing-tr { border-left: 3px solid #10B981; }

        /* --- KNOCKOUT BRACKET UI --- */
        .bracket-container {
            display: flex;
            justify-content: flex-start;
            padding: 20px;
            overflow-x: auto;
            padding-bottom: 80px;
        }

        .bracket-column {
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            min-width: 260px;
            margin: 0 15px;
        }

        .round-title {
            text-align: center;
            color: #D97706;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
            font-size: 13px;
        }

        .matchup {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid #334155;
            border-radius: 8px;
            margin: 10px 0;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            position: relative;
            transition: all 0.2s ease;
        }

        .matchup:hover {
            border-color: #D97706;
            box-shadow: 0 4px 15px rgba(217, 119, 6, 0.2);
        }

        .player-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            font-size: 14px;
            font-weight: 600;
        }

        .player-row:first-child { border-bottom: 1px solid #334155; }
        .score { font-family: monospace; font-size: 15px; color: #94A3B8; }
        .winner { color: #F8FAFC; }
        .winner .score { color: #10B981; font-weight: bold; }
        .bye-player { color: #475569; font-style: italic; font-weight: normal; }

        .live-pulse {
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: #EF4444;
            border-radius: 50%;
            margin-right: 8px;
            box-shadow: 0 0 8px #EF4444;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 6px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="/" class="nav-brand"><span class="gc-badge">GCTTA</span> 2026 GOLD COAST OPEN</a>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/registration">Registration</a>
            <a href="/update.html">Update</a>
            <a href="/schedule">Schedule</a>
            <a href="/draws" class="active">Live Draws</a>
        </div>
        <a href="/admin" class="btn-mobile-app">Admin</a>
    </nav>

    <div class="draw-header">
        <h1><span class="live-pulse"></span> Live Results & Draws</h1>
        <p>Select an event below to view current round robin pools and knockout brackets.</p>
        
        <div class="event-selector">
            <select id="eventSelect" onchange="renderSelectedEvent()">
                <!-- Populated dynamically via JS -->
            </select>
        </div>

        <div class="stage-toggles" id="stageToggles">
            <button class="btn-stage active" id="btnGroup" onclick="toggleStage('group')">Stage 1: Round Robin</button>
            <button class="btn-stage" id="btnKnockout" onclick="toggleStage('knockout')">Stage 2: Knockout</button>
        </div>
    </div>

    <!-- STAGE 1: GROUPS VIEW -->
    <div id="groupSection" class="group-stage-container">
        <div class="groups-grid" id="groupsGrid">
            <!-- Injected dynamically via JS -->
        </div>
    </div>

    <!-- STAGE 2: KNOCKOUT BRACKET VIEW -->
    <div id="knockoutSection" class="bracket-container" style="display: none;">
        <!-- Injected dynamically via JS -->
    </div>

    <script>
        // MOCK DATA FALLBACK
        const mockDrawData = {
            "1": {
                name: "Event #1: Men's Open Singles",
                hasGroups: true,
                hasKnockout: true,
                groups: [
                    {
                        name: "Group 1",
                        players: [
                            { name: "Lukas Kozak", wins: 2, losses: 0, pts: 4, advance: true },
                            { name: "Chin", wins: 1, losses: 1, pts: 3, advance: true },
                            { name: "Clare", wins: 0, losses: 2, pts: 2, advance: false }
                        ]
                    },
                    {
                        name: "Group 2",
                        players: [
                            { name: "Jakob Fensom", wins: 2, losses: 0, pts: 4, advance: true },
                            { name: "Jesse Wilson", wins: 1, losses: 1, pts: 3, advance: true },
                            { name: "Chad", wins: 0, losses: 2, pts: 2, advance: false }
                        ]
                    }
                ],
                knockout: [
                    {
                        roundName: "Quarter Finals",
                        matches: [
                            { p1: "Lukas Kozak", s1: 3, p2: "BYE", s2: 0, winner: 1 },
                            { p1: "Chin", s1: 1, p2: "Jesse Wilson", s2: 3, winner: 2 },
                            { p1: "Naoya Yamamoto", s1: 3, p2: "Chad", s2: 0, winner: 1 },
                            { p1: "Kane Townsend", s1: 2, p2: "Jakob Fensom", s2: 3, winner: 2 }
                        ]
                    },
                    {
                        roundName: "Semi Finals",
                        matches: [
                            { p1: "Lukas Kozak", s1: 3, p2: "Jesse Wilson", s2: 1, winner: 1 },
                            { p1: "Naoya Yamamoto", s1: 2, p2: "Jakob Fensom", s2: 3, winner: 2 }
                        ]
                    },
                    {
                        roundName: "Grand Final",
                        matches: [
                            { p1: "Lukas Kozak", s1: "-", p2: "Jakob Fensom", s2: "-", winner: 0 }
                        ]
                    }
                ]
            },
            "3": {
                name: "Event #3: Men's Open Doubles",
                hasGroups: false,
                hasKnockout: true,
                groups: [],
                knockout: [
                    {
                        roundName: "Semi Finals",
                        matches: [
                            { p1: "J. Fensom / L. Kozak", s1: 3, p2: "J. Wilson / Chad", s2: 0, winner: 1 },
                            { p1: "N. Yamamoto / K. Townsend", s1: 3, p2: "Chin / Partner", s2: 1, winner: 1 }
                        ]
                    },
                    {
                        roundName: "Grand Final",
                        matches: [
                            { p1: "J. Fensom / L. Kozak", s1: "-", p2: "N. Yamamoto / K. Townsend", s2: "-", winner: 0 }
                        ]
                    }
                ]
            },
            "20": {
                name: "Event #20: Under 800 Singles",
                hasGroups: true,
                hasKnockout: false,
                groups: [
                    {
                        name: "Pool A (3-Player Pool)",
                        players: [
                            { name: "Sam Xu", wins: 2, losses: 0, pts: 4, advance: true },
                            { name: "Kevin Xu", wins: 1, losses: 1, pts: 3, advance: false },
                            { name: "Alexey Shlykov", wins: 0, losses: 2, pts: 2, advance: false }
                        ]
                    }
                ],
                knockout: []
            }
        };

        let liveDrawData = {};

        async function loadDraws() {
            try {
                const response = await fetch('/api/draws');
                const data = await response.json();
                
                if (data.status === 'success' && Object.keys(data.draws).length > 0) {
                    liveDrawData = data.draws;
                } else {
                    liveDrawData = mockDrawData; // Fallback to mock data if DB is empty
                }
            } catch (err) {
                console.error("Error loading live draws:", err);
                liveDrawData = mockDrawData;
            }

            populateEventSelector();
            renderSelectedEvent();
        }

        function populateEventSelector() {
            const select = document.getElementById('eventSelect');
            select.innerHTML = '';
            Object.keys(liveDrawData).forEach(eventId => {
                const ev = liveDrawData[eventId];
                select.innerHTML += `<option value="${eventId}">${ev.name}</option>`;
            });
        }

        function renderSelectedEvent() {
            const eventId = document.getElementById('eventSelect').value;
            const eventData = liveDrawData[eventId];

            if (!eventData) return;

            const stageToggles = document.getElementById('stageToggles');
            const btnGroup = document.getElementById('btnGroup');
            const btnKnockout = document.getElementById('btnKnockout');

            // Handle toggle visibility based on event type
            if (eventData.hasGroups && eventData.hasKnockout) {
                stageToggles.style.display = 'flex';
                btnGroup.style.display = 'inline-block';
                btnKnockout.style.display = 'inline-block';
                toggleStage('group');
            } else if (eventData.hasGroups) {
                stageToggles.style.display = 'none';
                toggleStage('group');
            } else {
                stageToggles.style.display = 'none';
                toggleStage('knockout');
            }

            // Render Groups HTML
            const groupsGrid = document.getElementById('groupsGrid');
            groupsGrid.innerHTML = '';
            if (eventData.hasGroups && eventData.groups) {
                eventData.groups.forEach(g => {
                    let rows = g.players.map(p => `
                        <tr class="${p.advance ? 'advancing-tr' : ''}">
                            <td>${p.name}</td>
                            <td style="color:#10B981;">${p.wins}</td>
                            <td style="color:#EF4444;">${p.losses}</td>
                            <td><strong>${p.pts}</strong></td>
                        </tr>
                    `).join('');

                    groupsGrid.innerHTML += `
                        <div class="group-card">
                            <h3>${g.name}</h3>
                            <table class="group-table">
                                <thead><tr><th>Player / Pair</th><th>W</th><th>L</th><th>Pts</th></tr></thead>
                                <tbody>${rows}</tbody>
                            </table>
                        </div>
                    `;
                });
            }

            // Render Knockout Bracket HTML
            const knockoutSection = document.getElementById('knockoutSection');
            knockoutSection.innerHTML = '';
            if (eventData.hasKnockout && eventData.knockout) {
                eventData.knockout.forEach(rd => {
                    let matchCards = rd.matches.map(m => `
                        <div class="matchup">
                            <div class="player-row ${m.winner === 1 ? 'winner' : (m.p1 === 'BYE' ? 'bye-player' : '')}">
                                <span>${m.p1}</span>
                                <span class="score">${m.s1}</span>
                            </div>
                            <div class="player-row ${m.winner === 2 ? 'winner' : (m.p2 === 'BYE' ? 'bye-player' : '')}">
                                <span>${m.p2}</span>
                                <span class="score">${m.s2}</span>
                            </div>
                        </div>
                    `).join('');

                    knockoutSection.innerHTML += `
                        <div class="bracket-column">
                            <div class="round-title">${rd.roundName}</div>
                            ${matchCards}
                        </div>
                    `;
                });
            }
        }

        function toggleStage(stage) {
            const groupSec = document.getElementById('groupSection');
            const knockoutSec = document.getElementById('knockoutSection');
            const btnGroup = document.getElementById('btnGroup');
            const btnKnockout = document.getElementById('btnKnockout');

            if (stage === 'group') {
                groupSec.style.display = 'block';
                knockoutSec.style.display = 'none';
                btnGroup.classList.add('active');
                btnKnockout.classList.remove('active');
            } else {
                groupSec.style.display = 'none';
                knockoutSec.style.display = 'flex';
                btnKnockout.classList.add('active');
                btnGroup.classList.remove('active');
            }
        }

        // Fetch Live Data on initial Load
        document.addEventListener("DOMContentLoaded", loadDraws);
    </script>
</body>
</html>
